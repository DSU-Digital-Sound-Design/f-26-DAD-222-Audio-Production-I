baseURL = "https://dsu-digital-sound-design.github.io/f-26-DAD-222-Audio-Production-I/"
languageCode = "en-us"
title = "DAD 222: Audio Production I"
enableRobotsTXT = true

# Console renders the course pages; reveal-hugo renders the lecture decks.
# Order matters: Console is listed first so its templates win for HTML output,
# while reveal-hugo's *.reveal.html templates win for the Reveal output format.
theme = ["t-console-theme", "reveal-hugo"]

[outputFormats.Reveal]
  baseName = "index"
  mediaType = "text/html"
  isHTML = true

[params]
  accent = "#b6ff5c"
  description = "A practical introduction to music technology, digital audio production, and creative sound design."

  [params.reveal_hugo]
  custom_theme = "reveal-console.css"
  transition = "fade"
  slide_number = true

  [params.course]
    code = "DAD 222"
    title = "Audio Production I"
    term = "Fall 2026"
    meeting = "MWF 9:00–9:50"
    instructor = "Tate Carson"
    final = "Friday, December 11 · 8:00–10:00 AM"

  [params.schedule]
    # Monday of week 1. DSU Fall 2026 classes begin Aug 24.
    start = "2026-08-24"
    filterPlaceholder = 'filter — try "reaper" or "due"'

    # Overrides the theme's default tag vocabulary (must restate all tags).
    [[params.schedule.tags]]
      id = "slides"
      label = "Slides"
      color = "#6ec1ff"
    [[params.schedule.tags]]
      id = "project"
      label = "Projects"
      color = "#b6ff5c"
    [[params.schedule.tags]]
      id = "due"
      label = "Due"
      color = "#ff7a5c"
    [[params.schedule.tags]]
      id = "lab"
      label = "Labs"
      color = "#ffc85c"
    [[params.schedule.tags]]
      id = "drill"
      label = "Drills"
      color = "#c58cff"
    [[params.schedule.tags]]
      id = "guest"
      label = "Guests"
      color = "#5cffd6"
    [[params.schedule.tags]]
      id = "off"
      label = "No class"
      color = "#7d8a7a"
      skip = true

  [[params.facts]]
    key = "Meets"
    value = "MWF 9:00–9:50"
  [[params.facts]]
    key = "Room"
    value = "TCB 209"
  [[params.facts]]
    key = "Instructor"
    value = "Tate Carson"
  [[params.facts]]
    key = "Credits"
    value = "3"
  [[params.facts]]
    key = "Software"
    value = "REAPER, Vital, Sitala"
  [[params.facts]]
    key = "Grading"
    value = "Projects 50% · Attendance & participation 30% · Final project 20%"

[[menus.main]]
  name = "schedule"
  pageRef = "/schedule"
  weight = 10
[[menus.main]]
  name = "projects"
  pageRef = "/projects"
  weight = 20
[[menus.main]]
  name = "syllabus"
  pageRef = "/syllabus"
  weight = 30
[[menus.main]]
  name = "resources"
  pageRef = "/resources"
  weight = 40

[markup.goldmark.renderer]
  # Lecture decks contain raw HTML (iframes, embeds).
  unsafe = true

[markup.tableOfContents]
  ordered = false
  startLevel = 1
  endLevel = 2

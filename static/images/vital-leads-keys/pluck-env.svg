<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">Pluck · ENV 1</title><desc id="desc">Schematic envelope, not to scale. Delay and hold are zero. A short attack and decay to zero sustain. Note off is shown after the decay.</desc><rect width="720" height="330" rx="8" fill="#0c120e"/><g font-family="ui-monospace, Menlo, monospace"><text x="28" y="35" fill="#b6ff5c" font-size="22" text-anchor="start">Pluck · ENV 1</text><text x="28" y="65" fill="#a3b29e" font-size="18" text-anchor="start">Amplitude: the note fades away</text><path d="M65 235 L680 235" stroke="#2e3b30" fill="none" stroke-width="2"/><path d="M65 235 L65 90" stroke="#2e3b30" fill="none" stroke-width="2"/><text x="28" y="103" fill="#a3b29e" font-size="16" text-anchor="start">1</text><text x="28" y="240" fill="#a3b29e" font-size="16" text-anchor="start">0</text><text x="65" y="269" fill="#d5dfd0" font-size="17" text-anchor="start">Note on</text><text x="680" y="269" fill="#a3b29e" font-size="17" text-anchor="end">Time →</text><path d="M105 90 L105 235" stroke="#2e3b30" fill="none" stroke-width="2" stroke-dasharray="4 5"/><path d="M65 235 L105 105 Q155 210 360 235 L670 235" fill="none" stroke="#b6ff5c" stroke-width="4" stroke-linejoin="round"/><text x="150" y="130" fill="#d5dfd0" font-size="18" text-anchor="start">Decay 400 ms</text><text x="390" y="217" fill="#b6ff5c" font-size="18" text-anchor="start">Sustain 0%</text><path d="M560 100 L560 235" stroke="#6ec1ff" fill="none" stroke-width="2" stroke-dasharray="5 5"/><text x="560" y="85" fill="#6ec1ff" font-size="17" text-anchor="middle">Note off</text><text x="155" y="298" fill="#a3b29e" font-size="18" text-anchor="start">Reaches zero even while the key is held.</text><text x="70" y="85" fill="#d5dfd0" font-size="17" text-anchor="start">Attack 5 ms</text></g></svg>
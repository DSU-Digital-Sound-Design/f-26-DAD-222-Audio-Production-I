<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 345" role="img" aria-labelledby="title desc"><title id="title">Overlapping MIDI notes and pitch glide</title><desc id="desc">The second, higher MIDI note starts before the first ends. With one voice and glide enabled, pitch slides from the first note to the second. Schematic, not to scale.</desc><rect width="720" height="345" rx="8" fill="#0c120e"/><g font-family="ui-monospace, Menlo, monospace"><text x="28" y="36" fill="#b6ff5c" font-size="22" text-anchor="start">Overlap notes to hear glide</text><text x="28" y="64" fill="#a3b29e" font-size="17" text-anchor="start">REAPER piano roll · higher notes appear higher</text><path d="M120 95 L680 95" stroke="#2e3b30" fill="none" stroke-width="2"/><path d="M120 130 L680 130" stroke="#2e3b30" fill="none" stroke-width="2"/><path d="M120 165 L680 165" stroke="#2e3b30" fill="none" stroke-width="2"/><path d="M120 200 L680 200" stroke="#2e3b30" fill="none" stroke-width="2"/><text x="30" y="120" fill="#a3b29e" font-size="18" text-anchor="start">E4</text><text x="30" y="190" fill="#a3b29e" font-size="18" text-anchor="start">C4</text><rect x="145" y="170" width="280" height="27" rx="3" fill="#b6ff5c"/><rect x="370" y="100" width="280" height="27" rx="3" fill="#6ec1ff"/><path d="M370 135 L370 207" stroke="#a3b29e" fill="none" stroke-width="2" stroke-dasharray="4 4"/><path d="M425 135 L425 207" stroke="#a3b29e" fill="none" stroke-width="2" stroke-dasharray="4 4"/><text x="397" y="234" fill="#d5dfd0" font-size="17" text-anchor="middle">Overlap</text><text x="30" y="273" fill="#a3b29e" font-size="18" text-anchor="start">Pitch</text><path d="M145 285 H370 C385 285 400 255 425 255 H650" fill="none" stroke="#b6ff5c" stroke-width="4"/><text x="145" y="319" fill="#a3b29e" font-size="17" text-anchor="start">Voices 1 · Legato on · Always Glide off</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title desc"><title id="title">Lead · ENV 1</title><desc id="desc">Schematic amplitude envelope, not to scale. A 5 ms attack, 200 ms decay, 70% sustain until note off, and 100 ms release. Delay and hold are zero.</desc><rect width="720" height="450" rx="8" fill="#0c120e"/><g font-family="ui-monospace, Menlo, monospace"><text x="28" y="36" fill="#b6ff5c" font-size="22" text-anchor="start">Lead · ENV 1</text><text x="28" y="67" fill="#a3b29e" font-size="18" text-anchor="start">Amplitude: quick start, then a sustained note</text><path d="M65 285 L680 285" stroke="#2e3b30" fill="none" stroke-width="2"/><path d="M65 285 L65 120" stroke="#2e3b30" fill="none" stroke-width="2"/><text x="28" y="136" fill="#a3b29e" font-size="16" text-anchor="start">1</text><text x="28" y="290" fill="#a3b29e" font-size="16" text-anchor="start">0</text><path d="M110 135 L110 285" stroke="#2e3b30" fill="none" stroke-width="2" stroke-dasharray="4 5"/><path d="M535 120 L535 285" stroke="#6ec1ff" fill="none" stroke-width="2" stroke-dasharray="5 5"/><path d="M65 285 L110 135 Q180 177 280 177 L535 177 Q570 255 640 285" fill="none" stroke="#b6ff5c" stroke-width="4" stroke-linejoin="round"/><text x="83" y="113" fill="#d5dfd0" font-size="17" text-anchor="start">Attack</text><text x="176" y="141" fill="#d5dfd0" font-size="17" text-anchor="start">Decay</text><text x="355" y="162" fill="#b6ff5c" font-size="18" text-anchor="start">Sustain</text><text x="535" y="105" fill="#6ec1ff" font-size="17" text-anchor="middle">Note off</text><text x="587" y="218" fill="#d5dfd0" font-size="17" text-anchor="start">Release</text><text x="65" y="315" fill="#d5dfd0" font-size="17" text-anchor="start">Note on</text><text x="680" y="315" fill="#a3b29e" font-size="17" text-anchor="end">Time →</text><text x="360" y="349" fill="#a3b29e" font-size="17" text-anchor="middle">Holds at 70% until you release the key.</text><path d="M28 370 L692 370" stroke="#2e3b30" fill="none" stroke-width="2"/><text x="100" y="399" fill="#a3b29e" font-size="17" text-anchor="middle">Attack</text><text x="100" y="425" fill="#d5dfd0" font-size="20" text-anchor="middle">5 ms</text><text x="270" y="399" fill="#a3b29e" font-size="17" text-anchor="middle">Decay</text><text x="270" y="425" fill="#d5dfd0" font-size="20" text-anchor="middle">200 ms</text><text x="440" y="399" fill="#a3b29e" font-size="17" text-anchor="middle">Sustain</text><text x="440" y="425" fill="#d5dfd0" font-size="20" text-anchor="middle">70%</text><text x="610" y="399" fill="#a3b29e" font-size="17" text-anchor="middle">Release</text><text x="610" y="425" fill="#d5dfd0" font-size="20" text-anchor="middle">100 ms</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">Audio and modulation paths</title><desc id="desc">Oscillator 1 audio passes through Filter 1 to the output. Env 1 controls amplitude. Env 2, the Bright macro, and velocity control filter cutoff. Simplified signal path.</desc><rect width="720" height="330" rx="8" fill="#0c120e"/><g font-family="ui-monospace, Menlo, monospace"><text x="28" y="36" fill="#b6ff5c" font-size="22" text-anchor="start">Follow the sound</text><rect x="28" y="80" width="165" height="80" rx="4" fill="none" stroke="#2e3b30" stroke-width="2"/><text x="110.5" y="111" fill="#d5dfd0" font-size="20" text-anchor="middle">OSC 1</text><text x="110.5" y="141" fill="#a3b29e" font-size="17" text-anchor="middle">Saw wave</text><rect x="268" y="80" width="185" height="80" rx="4" fill="none" stroke="#2e3b30" stroke-width="2"/><text x="360.5" y="111" fill="#d5dfd0" font-size="20" text-anchor="middle">FILTER 1</text><text x="360.5" y="141" fill="#a3b29e" font-size="17" text-anchor="middle">Low-pass</text><rect x="528" y="80" width="164" height="80" rx="4" fill="none" stroke="#2e3b30" stroke-width="2"/><text x="610.0" y="111" fill="#d5dfd0" font-size="20" text-anchor="middle">OUTPUT</text><text x="610.0" y="141" fill="#a3b29e" font-size="17" text-anchor="middle">Amplitude</text><path d="M194 120 L258 120" stroke="#b6ff5c" fill="none" stroke-width="2"/><text x="242" y="113" fill="#b6ff5c" font-size="24" text-anchor="start">›</text><path d="M454 120 L518 120" stroke="#b6ff5c" fill="none" stroke-width="2"/><text x="502" y="113" fill="#b6ff5c" font-size="24" text-anchor="start">›</text><path d="M360 218 L360 165" stroke="#6ec1ff" fill="none" stroke-width="2"/><text x="360" y="244" fill="#6ec1ff" font-size="18" text-anchor="middle">ENV 2 / Bright / Velocity</text><path d="M610 218 L610 165" stroke="#6ec1ff" fill="none" stroke-width="2"/><text x="610" y="244" fill="#6ec1ff" font-size="18" text-anchor="middle">ENV 1</text><text x="28" y="292" fill="#a3b29e" font-size="17" text-anchor="start">Green: audio path     Blue: controls that shape the sound</text></g></svg>